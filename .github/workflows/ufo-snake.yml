name: UFO Contribution Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate UFO animation
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: node .github/scripts/generate.js ${{ github.repository_owner }} ufo-contributions.svg

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ufo-contributions.svg
          git diff --staged --quiet || git commit -m "Update UFO contribution animation"
          git push
