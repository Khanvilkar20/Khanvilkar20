name: ⚽ Football Contributions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create football animation
        run: |
          mkdir -p dist

          cat > dist/football-contributions.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg"
               viewBox="0 0 1200 300"
               width="1200"
               height="300">

            <rect width="1200" height="300" fill="#0B0F0C"/>

            <!-- Football pitch -->
            <rect x="30" y="30"
                  width="1140"
                  height="240"
                  rx="12"
                  fill="none"
                  stroke="#9CA3AF"
                  stroke-width="2"/>

            <line x1="600" y1="30"
                  x2="600" y2="270"
                  stroke="#6B7280"
                  stroke-width="2"/>

            <circle cx="600" cy="150"
                    r="45"
                    fill="none"
                    stroke="#6B7280"
                    stroke-width="2"/>

            <!-- Contribution cells -->
            <g fill="#374151">
              <rect x="100" y="80" width="18" height="18"/>
              <rect x="130" y="80" width="18" height="18"/>
              <rect x="160" y="80" width="18" height="18"/>
              <rect x="190" y="80" width="18" height="18"/>

              <rect x="100" y="110" width="18" height="18"/>
              <rect x="130" y="110" width="18" height="18" fill="#6B7280"/>
              <rect x="160" y="110" width="18" height="18" fill="#9CA3AF"/>
              <rect x="190" y="110" width="18" height="18"/>

              <rect x="100" y="140" width="18" height="18"/>
              <rect x="130" y="140" width="18" height="18" fill="#9CA3AF"/>
              <rect x="160" y="140" width="18" height="18" fill="#D1D5DB"/>
              <rect x="190" y="140" width="18" height="18"/>

              <rect x="100" y="170" width="18" height="18"/>
              <rect x="130" y="170" width="18" height="18"/>
              <rect x="160" y="170" width="18" height="18" fill="#6B7280"/>
              <rect x="190" y="170" width="18" height="18"/>
            </g>

            <!-- Goal -->
            <path d="M1080 100 L1150 100 L1150 200 L1080 200"
                  fill="none"
                  stroke="#D1D5DB"
                  stroke-width="5"/>

            <!-- Football -->
            <g>
              <circle r="13" fill="#FFFFFF">
                <animateMotion
                  dur="6s"
                  repeatCount="indefinite"
                  path="M80,150 C250,100 400,200 600,150 S900,100 1110,150"/>
              </circle>
            </g>

            <!-- Player -->
            <g fill="#D1D5DB">
              <circle cx="75" cy="130" r="14"/>
              <path d="M75 145 L75 190 M75 155 L50 175 M75 155 L100 170 M75 190 L55 220 M75 190 L95 220"
                    stroke="#D1D5DB"
                    stroke-width="8"
                    fill="none"
                    stroke-linecap="round">
                <animateTransform
                  attributeName="transform"
                  type="translate"
                  values="0 0;180 10;360 -5;540 0;720 10;900 0"
                  dur="6s"
                  repeatCount="indefinite"/>
              </path>
            </g>

            <!-- #7 celebration -->
            <text x="1050" y="75"
                  fill="#FFFFFF"
                  font-family="Arial, sans-serif"
                  font-size="42"
                  font-weight="bold"
                  text-anchor="middle">
              #7
            </text>

            <text x="1050" y="245"
                  fill="#D1D5DB"
                  font-family="Arial, sans-serif"
                  font-size="20"
                  font-weight="bold"
                  text-anchor="middle">
              GOAL!
            </text>

          </svg>
          EOF

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_DIR: dist
